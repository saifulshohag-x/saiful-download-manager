name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build SaifulDownloadManager.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "SaifulDownloadManager" `
            --collect-all customtkinter `
            --collect-all yt_dlp `
            --collect-submodules yt_dlp `
            --hidden-import "tkinter" `
            --hidden-import "darkdetect" `
            --hidden-import "winreg" `
            --hidden-import "pystray" `
            --hidden-import "PIL" `
            --hidden-import "PIL._tkinter_finder" `
            --add-data "extension;extension" `
            --add-data "firefox_extension;firefox_extension" `
            main.py

      - name: Verify exe exists
        run: |
          if (Test-Path "dist\SaifulDownloadManager.exe") {
            $size = (Get-Item "dist\SaifulDownloadManager.exe").Length / 1MB
            Write-Host "Built: dist\SaifulDownloadManager.exe ($([math]::Round($size,1)) MB)"
          } else {
            Write-Error "exe not found!"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaifulDownloadManager-windows-exe
          path: dist/SaifulDownloadManager.exe
          retention-days: 90

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SaifulDownloadManager.exe
          name: Saiful Download Manager ${{ github.ref_name }}
          draft: false
          prerelease: false
